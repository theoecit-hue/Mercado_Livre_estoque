<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do dono</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--tx:#1d1d28;--mu:#6b6b7a;--bd:#e2e2ea;--ac:#2d3277;--dg:#b3261e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14141b;--card:#1f1f2a;--tx:#f0f0f5;--mu:#a0a0b2;--bd:#34344a;--ac:#9aa4ff;--dg:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:18px}
.mu{color:var(--mu);font-size:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:4px}
.w{grid-column:1/-1}
input,select{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:var(--bg)}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:6px 10px;font-size:13px}
button.dg{color:var(--dg)}
button:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.t{flex:1;min-width:0}.t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.err{color:var(--dg);font-size:14px;min-height:20px}
details{margin-top:6px}summary{cursor:pointer;font-size:14px;color:var(--mu)}
@media(max-width:560px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div id="gate" class="box" style="max-width:360px;margin:60px auto">
  <h1>Área do dono</h1>
  <p class="mu">Digite a senha para continuar.</p>
  <form id="fg" style="grid-template-columns:1fr"><input id="pw" type="password" autocomplete="current-password" placeholder="Senha" autofocus><button type="submit">Entrar</button></form>
  <div id="ge" class="err"></div>
</div>
<div id="panel" hidden>
  <h1>Painel do dono</h1>
  <p class="mu">Cole o link do produto. O site busca nome, foto e preço sozinho e se atualiza.</p>
  <div class="box">
    <h2>Adicionar produto</h2>
    <form id="f">
      <label class="w">Link do produto (seu link de afiliado)<input name="link" type="url" required placeholder="https://"></label>
      <label class="w">Tipo<select name="tipo"><option value="afiliado">Link de afiliado</option><option value="proprio">Produto meu</option></select></label>
      <div class="w"><details><summary>Preencher à mão (só se a busca automática falhar)</summary>
        <div style="display:grid;gap:10px;margin-top:10px"><label>Nome<input name="nome" maxlength="120"></label><label>Preço (ex.: R$ 199,90)<input name="preco" maxlength="20"></label><label>Link da imagem<input name="img" type="url" placeholder="https://"></label></div></details></div>
      <div class="w acts"><button type="submit" id="fb">Adicionar</button></div>
    </form>
    <div id="fe" class="err"></div>
  </div>
  <div class="box"><h2>Seus produtos (<span id="cnt">0</span>)</h2><div id="list"></div>
    <div class="acts" style="margin-top:10px"><button class="sec" id="rf">Atualizar preços agora</button></div></div>
  <button class="sec" id="exit">Sair</button>
</div>
</main>
<script>
var $=function(i){return document.getElementById(i)},senha='';
try{senha=sessionStorage.getItem('vs')||''}catch(e){}
function call(body){
  body.senha=senha;
  return fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.erro||'Erro');return j})});
}
function draw(items){
  $('cnt').textContent=items.length;var l=$('list');l.textContent='';
  if(!items.length){var p=document.createElement('p');p.className='mu';p.textContent='Nenhum produto ainda.';l.appendChild(p)}
  items.forEach(function(p,i){
    var r=document.createElement('div');r.className='row';
    var t=document.createElement('div');t.className='t';
    var b=document.createElement('b');b.textContent=p.nome||'(sem nome ainda)';
    var s=document.createElement('span');s.className='mu';
    s.textContent=(p.tipo==='afiliado'?'Afiliado':'Meu produto')+(p.preco?' · '+p.preco:'')+(p.erro&&!p.nome?' · busca automática falhou, remova e adicione preenchendo à mão':'');
    t.appendChild(b);t.appendChild(s);r.appendChild(t);
    var a=document.createElement('div');a.className='acts';
    function btn(x,fn,c){var e=document.createElement('button');e.type='button';e.className='sec'+(c?' '+c:'');e.textContent=x;e.onclick=fn;a.appendChild(e)}
    if(i>0)btn('Subir',function(){act({acao:'move',id:p.id,dir:'up'})});
    if(i<items.length-1)btn('Descer',function(){act({acao:'move',id:p.id,dir:'down'})});
    btn('Remover',function(){if(confirm('Remover este produto?'))act({acao:'remove',id:p.id})},'dg');
    r.appendChild(a);l.appendChild(r)});
}
function act(b){return call(b).then(draw).catch(function(e){$('fe').textContent=e.message})}
function entrar(){return call({acao:'list'}).then(function(d){$('gate').hidden=true;$('panel').hidden=false;draw(d);try{sessionStorage.setItem('vs',senha)}catch(e){}return true})}
$('fg').onsubmit=function(e){e.preventDefault();senha=$('pw').value;$('ge').textContent='';entrar().catch(function(x){$('ge').textContent=x.message;$('pw').value='';senha=''})};
$('f').onsubmit=function(e){
  e.preventDefault();var f=$('f'),b=$('fb');b.disabled=true;b.textContent='Buscando dados...';$('fe').textContent='';
  call({acao:'add',link:f.link.value.trim(),tipo:f.tipo.value,nome:f.nome.value,preco:f.preco.value,img:f.img.value}).then(function(d){draw(d);f.reset()}).catch(function(x){$('fe').textContent=x.message}).then(function(){b.disabled=false;b.textContent='Adicionar'});
};
$('rf').onclick=function(){act({acao:'refresh'});$('fe').textContent='Os preços serão buscados de novo na próxima visita ao site.'};
$('exit').onclick=function(){try{sessionStorage.removeItem('vs')}catch(e){}location.reload()};
if(senha)entrar().catch(function(){senha=''});
</script>
</body>
</html>
